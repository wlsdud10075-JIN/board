<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무일지 기획 미리보기</title>
<style>
:root {
  --bg: #f6f7fb; --card: #fff; --ink: #1d2433; --muted: #667085; --line: #e4e7ee;
  --side: #161a2e; --side-ink: #c9cde0; --primary: #7c6cf0; --primary-soft: #efedff;
  --ok: #16834a; --ok-soft: #e7f6ee; --warn: #9a5b00; --warn-soft: #fff5dc; --bad: #c62828; --bad-soft: #fdecec;
  --blue: #1d5fd1; --blue-soft: #e8f0fe;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; word-break: keep-all; }
button { font: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
.demo { position: sticky; top: 0; z-index: 20; background: #fffbe8; border-bottom: 1px solid #f0e2a8; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.demo b { margin-right: 4px; }
.demo .who { display: flex; flex-wrap: wrap; gap: 6px; }
.demo .who button { border: 1px solid #e3d48f; background: #fff; border-radius: 999px; padding: 3px 11px; }
.demo .who button.on { background: #3b2f00; color: #fff; border-color: #3b2f00; }
.demo .hint { color: #7a6a20; margin-left: auto; }
.demo .reset { border: 0; background: none; color: #7a6a20; text-decoration: underline; }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 42px); }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } }
aside { background: var(--side); color: var(--side-ink); padding: 16px 10px; }
aside .brand { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; padding: 0 8px 14px; border-bottom: 1px solid #262b45; }
aside .brand span { width: 26px; height: 26px; background: var(--primary); border-radius: 6px; display: grid; place-items: center; font-size: 13px; }
aside .me { padding: 12px 8px; border-bottom: 1px solid #262b45; }
aside .me b { color: #fff; display: block; }
aside .me small { color: #8d93ad; }
aside nav { padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
aside nav .grp { font-size: 11px; color: #6f7594; padding: 10px 8px 4px; }
aside nav a { display: flex; justify-content: space-between; align-items: center; color: var(--side-ink); text-decoration: none; padding: 7px 10px; border-radius: 8px; }
aside nav a.on { background: #2b2f4d; color: #fff; }
aside nav a.dim { opacity: .45; pointer-events: none; }
aside nav a .new { background: #ef4444; color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; }
@media (max-width: 860px) { aside { padding: 8px; } aside .me, aside nav .grp, aside nav a.dim { display: none; } aside nav { flex-direction: row; flex-wrap: wrap; } aside .brand { border: 0; padding-bottom: 6px; } }
main { padding: 22px 26px 60px; min-width: 0; }
@media (max-width: 640px) { main { padding: 16px; } }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.top h1 { font-size: 21px; margin: 0; }
.top .sub { color: var(--muted); font-size: 13px; width: 100%; margin-top: -6px; }
.bell { margin-left: auto; position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.bell .n { position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff; font-size: 11px; border-radius: 999px; padding: 0 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; font-weight: 600; }
.btn.pri { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; }
.b-gray { background: #eef0f4; color: #4b5263; } .b-blue { background: var(--blue-soft); color: var(--blue); } .b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); } .b-pur { background: var(--primary-soft); color: #5a49d6; } .b-bad { background: var(--bad-soft); color: var(--bad); }
.note { border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.note.warn { background: var(--warn-soft); color: var(--warn); } .note.info { background: var(--blue-soft); color: var(--blue); } .note.ok { background: var(--ok-soft); color: var(--ok); }
table.j { width: 100%; border-collapse: collapse; }
table.j th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.j td { padding: 5px 6px; border-bottom: 1px solid #f0f2f6; vertical-align: top; }
table.j td.t { width: 132px; white-space: nowrap; } table.j td.x { width: 34px; text-align: right; }
table.j td.n { width: 28%; }
table.j input, table.j textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: #fff; }
table.j textarea { resize: vertical; min-height: 34px; }
table.j input:read-only, table.j textarea:read-only { background: #fafbfc; border-color: transparent; }
.tcell { display: flex; gap: 4px; } .tcell input { width: 76px; }
@media (max-width: 640px) {
  table.j thead { display: none; } table.j tr { display: grid; grid-template-columns: 1fr auto; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  table.j td { border: 0; padding: 2px 0; width: auto !important; } table.j td.k { grid-column: 1 / -1; } table.j td.n { grid-column: 1 / -1; }
}
.auto { margin-top: 14px; border-top: 2px dashed var(--line); padding-top: 12px; }
.auto h3, .card h3 { margin: 0 0 8px; font-size: 15px; }
.auto .sub, .muted { color: var(--muted); font-size: 12.5px; }
table.a { width: 100%; border-collapse: collapse; font-size: 13px; }
table.a td, table.a th { padding: 6px 8px; border-bottom: 1px solid #f0f2f6; text-align: left; }
table.a th { color: var(--muted); font-weight: 600; font-size: 12px; }
@media (max-width: 640px) { table.a th:nth-child(4), table.a td:nth-child(4) { display: none; } }
.grid2 { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
.blist button { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.blist button.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.blist .d { font-weight: 700; }
.line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 12px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 112px; background: #fff; }
.step .t { font-size: 11.5px; color: var(--muted); } .step .nm { font-weight: 700; }
.step.done { background: var(--ok-soft); border-color: #bfe5cf; } .step.cur { background: var(--warn-soft); border-color: #f0d68d; } .step.skip { opacity: .5; text-decoration: line-through; }
.arrow { color: var(--muted); }
.stat { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.stat div { background: var(--bg); border-radius: 10px; padding: 6px 12px; }
details.p { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; background: #fff; }
details.p > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
details.p > summary::-webkit-details-marker { display: none; }
details.p > summary::before { content: "▸"; color: var(--muted); }
details.p[open] > summary::before { content: "▾"; }
details.p .body { padding: 0 14px 14px; }
.cm { border-left: 3px solid var(--primary); background: #faf9ff; border-radius: 0 8px 8px 0; padding: 6px 10px; margin-top: 6px; font-size: 13px; }
.cm .w { font-size: 11.5px; color: var(--muted); }
textarea.op { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-height: 52px; resize: vertical; }
.unsub { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
.plan h2 { font-size: 17px; margin: 18px 0 8px; } .plan h2:first-child { margin-top: 0; }
.plan table { width: 100%; border-collapse: collapse; font-size: 13.5px; } .plan td, .plan th { border-bottom: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
.plan th { width: 26%; color: #39404f; }
.plan ul { margin: 4px 0; padding-left: 20px; }
.toast { position: fixed; right: 16px; bottom: 16px; background: #1d2433; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: .25s; z-index: 30; max-width: 340px; }
.toast.on { opacity: 1; transform: none; }
.set label { display: block; font-weight: 600; margin-bottom: 4px; }
.set select, .set input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: #fff; }
</style>
</head>
<body>
<div class="demo">
  <b>👀 미리보기</b>
  <span>누구로 볼까요?</span>
  <div class="who" id="who"></div>
  <span class="hint">샘플 데이터 · 창을 닫아도 유지(실제는 서버 저장) <button class="reset" onclick="resetAll()">처음으로</button></span>
</div>
<div class="app">
  <aside>
    <div class="brand"><span>H</span>HeymanBoard</div>
    <div class="me"><b id="meName"></b><small id="meRole"></small></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const TODAY = '2026-11-06', YESTERDAY = '2026-11-05';
const ROLE = { sales: '영업', inspection: '현지확인', auction: '경매', manager: '관리' };
const STAFF = [
  ['u1', '김영업', 'sales'], ['u2', '이영업', 'sales'], ['u3', '박영업', 'sales'], ['u4', '최영업', 'sales'], ['u5', '한영업', 'sales'],
  ['u6', '문영업', 'sales'], ['u7', '윤현지', 'inspection'], ['u8', '장현지', 'inspection'], ['u9', '서경매', 'auction'], ['u10', '정관리', 'manager'], ['u11', '강관리', 'manager'],
].map(([id, name, role]) => ({ id, name, role }));
const APPROVERS = { 팀장: { id: 'a1', name: '정팀장', perm: 'manager' }, 부장: { id: 'a4', name: '임부장', perm: 'admin' }, 상무: { id: 'a2', name: '오상무', perm: 'admin' }, 대표: { id: 'a3', name: '홍대표', perm: 'admin' }, x: { id: 'a5', name: '백업무', perm: 'manager' } };
const PERM_LABEL = { manager: '업무관리자', admin: '최고관리자', user: '일반' };
const STEP_TITLES = ['팀장', '부장', '상무', '대표'];
const VIEWERS = [
  { id: 'u1', label: '김영업 (작성자)' }, { id: 'a1', label: '정팀장 (업무관리자·팀장)' }, { id: 'a4', label: '임부장 (최고관리자·부장)' }, { id: 'a2', label: '오상무 (최고관리자·상무)' }, { id: 'a3', label: '홍대표 (최고관리자·대표)' }, { id: 'su', label: '시스템관리자' },
];
const TASKS = ['매입예정 등록 및 딜러 통화', '바이어 회신 확인·견적 전달', '검차 일정 조율', 'ERP 서류 확인', '경매장 출품 확인', '선적 계획 정리', '입금 요청 처리', '고객 상담'];
const NOTES = ['', '', '', '딜러 연락 지연', '내일 재확인 필요', ''];

function sampleEntries(seed) {
  const times = ['09:10', '10:30', '13:20', '15:00', '17:10'];
  return times.slice(0, 3 + (seed % 3)).map((t, i) => ({ time: t, task: TASKS[(seed + i * 3) % TASKS.length], note: NOTES[(seed + i) % NOTES.length] }));
}
function sampleAuto(seed) {
  const plates = ['12가3456', '48다1710', '34나5678', '56라7890', '91샘0001'];
  const acts = [['10:42', '매입예정 등록 (셀프검차매입)', '구매대기'], ['14:05', '구매확정 → ERP 전송', 'ERP 전환완료'], ['15:31', '사진 2장 ERP 전송', 'ERP 전환완료'], ['16:12', '계약금 요청 3,000,000원', '요청중']];
  return acts.slice(0, 1 + (seed % 4)).map((a, i) => ({ time: a[0], plate: plates[(seed + i) % plates.length], what: a[1], state: a[2] }));
}
const autoFor = (uid) => sampleAuto(uid === 'u1' ? 3 : STAFF.findIndex((s) => s.id === uid));
function fresh() {
  const j = {};
  STAFF.forEach((s, i) => {
    j[s.id + '|' + YESTERDAY] = { entries: sampleEntries(i + 2), status: 'approved', at: '18:4' + (i % 10) };
    const unsub = ['u4', 'u8', 'u11'].includes(s.id);
    const mine = s.id === 'u1';
    j[s.id + '|' + TODAY] = { entries: mine ? [{ time: '09:00', task: '출근 · 매입예정 확인', note: '' }, { time: '10:40', task: '12가3456 셀프검차매입 등록', note: '' }] : sampleEntries(i), status: (unsub || mine) ? 'draft' : 'submitted', at: (unsub || mine) ? null : '18:' + String(10 + i * 3).padStart(2, '0') };
  });
  const yComments = [
    { step: '팀장', who: '정팀장', target: 'u2', body: '48다1710 금액 재전송 잘 처리했습니다.' },
    { step: '팀장', who: '정팀장', target: null, body: '전반적으로 양호. 미수 바이어 연락 계속 부탁합니다.' },
    { step: '부장', who: '임부장', target: null, body: '팀장 의견과 같습니다.' },
    { step: '상무', who: '오상무', target: 'u9', body: '경매장 출품 일정 공유 바랍니다.' },
    { step: '상무', who: '오상무', target: null, body: '확인했습니다.' },
    { step: '대표', who: '홍대표', target: null, body: '수고 많았습니다.' },
  ];
  return {
    viewer: 'u1', page: 'journal', jdate: TODAY, sel: TODAY, cutoff: '19:00',
    titles: { a1: '팀장', a4: '부장', a2: '상무', a3: '대표' },
    journals: j,
    batches: {
      [YESTERDAY]: { steps: [{ t: '팀장', s: 'done', at: '19:20' }, { t: '부장', s: 'done', at: '19:48' }, { t: '상무', s: 'done', at: '20:05' }, { t: '대표', s: 'done', at: '21:30' }], comments: yComments },
      [TODAY]: { steps: [{ t: '팀장', s: 'cur' }, { t: '부장', s: 'wait' }, { t: '상무', s: 'wait' }, { t: '대표', s: 'wait' }], comments: [] },
    },
    drafts: {},
  };
}
let S = load();
function load() { try { const v = JSON.parse(localStorage.getItem('wj-demo2')); if (v && v.journals) return v; } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem('wj-demo2', JSON.stringify(S)); } catch (e) {} }
function resetAll() { S = fresh(); save(); render(); toast('처음 상태로 되돌렸습니다.'); }
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2600); }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const staff = (id) => STAFF.find((s) => s.id === id);
const viewerTitle = () => S.titles[S.viewer] || null;
const isApprover = () => !!viewerTitle();
const isWriter = () => !!staff(S.viewer);
const curStep = (b) => b.steps.find((s) => s.s === 'cur');
const isMyTurn = (date) => { const b = S.batches[date]; const c = b && curStep(b); return !!(c && c.t === viewerTitle()); };
const dow = (d) => '일월화수목금토'[new Date(d + 'T00:00:00').getDay()];
const isWeekend = (d) => [0, 6].includes(new Date(d + 'T00:00:00').getDay());
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const pastCutoff = () => true;   // 미리보기: 오늘은 마감이 지난 것으로 본다

function render() {
  const who = document.getElementById('who');
  who.innerHTML = VIEWERS.map((v) => `<button class="${S.viewer === v.id ? 'on' : ''}" onclick="setViewer('${v.id}')">${v.label}</button>`).join('');
  const meName = S.viewer === 'su' ? '시스템관리자' : (staff(S.viewer)?.name || Object.values(APPROVERS).find((a) => a.id === S.viewer)?.name);
  document.getElementById('meName').textContent = meName;
  document.getElementById('meRole').textContent = S.viewer === 'su' ? 'super' : (isWriter() ? ROLE[staff(S.viewer).role] : PERM_LABEL[Object.values(APPROVERS).find((a) => a.id === S.viewer).perm] + ' · 결재 ' + (viewerTitle() || '없음'));
  const turn = Object.keys(S.batches).filter(isMyTurn).length;
  const items = [
    ['grp', '업무'], ['x', '매입예정(Invoice)'], ['x', '경매/구매'], ['x', '내 정산·미수 (포털)'],
    ['grp', '업무일지'],
    ['journal', '업무일지', isWriter()],
    ['approval', '업무일지결재', isApprover() || S.viewer === 'su', turn],
    ['grp', '관리'], ['users', '사용자관리 (결재 직급)', S.viewer === 'su'], ['settings', '기능설정 (마감 시각)', S.viewer === 'su'],
    ['grp', '기획'], ['plan', '📋 기획 요약', true],
  ];
  document.getElementById('nav').innerHTML = items.map(([k, label, show, n]) => k === 'grp' ? `<div class="grp">${label}</div>`
    : k === 'x' ? `<a class="dim">${label}</a>`
    : show ? `<a href="#" class="${S.page === k ? 'on' : ''}" onclick="go('${k}');return false">${label}${n ? `<span class="new">${n}</span>` : ''}</a>` : '').join('');
  const allowed = { journal: isWriter(), approval: isApprover() || S.viewer === 'su', users: S.viewer === 'su', settings: S.viewer === 'su', plan: true };
  if (!allowed[S.page]) S.page = isWriter() ? 'journal' : (isApprover() ? 'approval' : 'plan');
  const main = document.getElementById('main');
  main.innerHTML = ({ journal: viewJournal, approval: viewApproval, users: viewUsers, settings: viewSettings, plan: viewPlan })[S.page]();
  save();
}
function setViewer(id) { S.viewer = id; render(); }
function go(p) { S.page = p; render(); window.scrollTo(0, 0); }
function bell() {
  const turn = Object.keys(S.batches).filter(isMyTurn);
  return `<span class="bell">🔔${turn.length ? `<span class="n">${turn.length}</span>` : ''}</span>`;
}

/* ── 업무일지 (작성자) ── */
function viewJournal() {
  const key = S.viewer + '|' + S.jdate;
  const j = S.journals[key] || (S.journals[key] = { entries: [{ time: '', task: '', note: '' }], status: 'draft', at: null });
  const b = S.batches[S.jdate];
  const locked = j.status !== 'draft';
  const canRecall = j.status === 'submitted' && b && b.steps[0].s === 'cur';
  const statusBadge = { draft: '<span class="badge b-gray">작성 중</span>', submitted: '<span class="badge b-blue">결재 대기</span>', approved: '<span class="badge b-ok">결재 완료</span>' }[j.status];
  const dates = [YESTERDAY, TODAY];
  let warn = '';
  if (j.status === 'draft' && S.jdate === TODAY && !isWeekend(S.jdate) && pastCutoff()) warn = `<div class="note warn" style="margin-bottom:12px">⏰ 상신 마감(${S.cutoff})이 지났습니다 — 팀장 결재 전까지는 상신하면 오늘 기안에 함께 들어갑니다.</div>`;
  const rows = j.entries.map((e, i) => `<tr>

function setE(i, k, v) { S.journals[S.viewer + '|' + S.jdate].entries[i][k] = v; markSaved(); save(); const el = document.getElementById('saved'); if (el) el.textContent = savedText(); }

function delE(i) { const e = S.journals[S.viewer + '|' + S.jdate].entries; e.splice(i, 1); if (!e.length) e.push({ time: nowHM(), task: '', note: '' }); markSaved(); render(); }
function addFromAuto(t, w) { markSaved(); const e = S.journals[S.viewer + '|' + S.jdate].entries; const last = e[e.length - 1]; if (last && !last.time && !last.task) e.pop(); e.push({ time: t, task: w, note: '' }); e.sort((a, b) => (a.time || '99').localeCompare(b.time || '99')); render(); toast('표에 넣었습니다.'); }

function recall() { const j = S.journals[S.viewer + '|' + S.jdate]; j.status = 'draft'; j.at = null; render(); toast('회수했습니다 — 고친 뒤 다시 상신하세요.'); }

      <tr><th>묶음</th><td>날짜별 자동 묶음. 마감 시각(기본 19:00, 기능설정에서 변경)에 팀장 알림 + 미상신 표시. 팀장 승인 전까지 늦게 올린 사람도 합류</td></tr>

      <tr><th>회수</th><td>팀장이 승인하기 전까지 기안자가 회수해서 고칠 수 있음</td></tr>
      <tr><th>자동 활동</th><td>그날 본인의 board 활동(차량 등록·ERP 전송·요청·사진)을 감사 로그에서 자동으로 — <b>옮겨 적을 필요 없이 상신 때 그대로 같이 올라감</b>. 상신 순간 고정</td></tr>
      <tr><th>입력</th><td>[+ 줄 추가] = 지금 시각 자동(고칠 수 있음). 적을 때마다 <b>자동 저장</b>(서버) — 다른 일 하다 와도 그대로, 원할 때 [상신]</td></tr>
      <tr><th>알림</th><td>종·휴대폰 웹푸시 먼저. BizM 알림톡은 템플릿 검수 승인 뒤 <b>ERP 월정산과 똑같이</b> — 차례가 온 결재자 1명에게 결재요청(전용 링크, 5일), 링크로 열면 로그인 없이 내용 보기·인원별 의견·승인, 최종 승인 시 기안자·결재선에 완료 알림</td></tr>
      <tr><th>주말</th><td>쓰기·상신 가능, 마감 알림·미상신 표시 없음. 공휴일은 평일 취급</td></tr>
      <tr><th>기록</th><td>작성·상신·회수·의견·승인 전부 감사 로그</td></tr>
      <tr><th>인스턴스</th><td>heymanboard·ssancarboard 각각(직원·DB 별도)</td></tr>
    </table>
    <h2>확인할 것 (미리보기에서 가정한 부분)</h2>
    <ul>
      <li>결재가 끝나면 기안자가 자기 일지에서 <b>자기에게 달린 의견 + 전체 의견</b>을 본다 (다른 사람에게 달린 의견은 안 보임)</li>
      <li>대표 최종 승인 뒤에는 일지를 고칠 수 없다</li>
      <li>팀장이 이미 승인한 날에 늦게 상신하면 → 그날 「추가 기안」으로 따로 모인다</li>
      <li>시간 칸은 한 칸(시작 시각). 「09:00~10:30」처럼 범위가 필요하면 말씀해 주세요</li>
    </ul>
    <h2>제안 (넣을지 골라 주세요)</h2>
    <ul>
      <li>전날 일지 불러오기 — 미리보기에 넣어 둠</li>
      <li>주간·월간 모아 보기 + 엑셀 다운로드 (결재자·시스템관리자)</li>
      <li>휴가·외근 표시(그날 미상신자에서 제외)</li>
      <li>알림톡 템플릿은 개발 전에 먼저 BizM 에 신청 — 검수에 며칠 걸림</li>
    </ul>
  </div>`;
